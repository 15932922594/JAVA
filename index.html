<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGENT ACCESS // 载入中</title>
<style>
  html,body{height:100%;margin:0;background:#0F1923;color:#ECE8E1;
    font-family:"JetBrains Mono",Consolas,"Courier New","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px}
  .logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:clamp(24px,5vw,40px);
    letter-spacing:5px;text-transform:uppercase;font-family:"Tungsten","Oswald","Arial Narrow",Impact,sans-serif}
  .sl{width:20px;height:44px;background:#FF4655;transform:skewX(-14deg);box-shadow:0 0 30px -4px #FF4655;
    animation:sl .8s cubic-bezier(.2,1,.3,1) both}
  @keyframes sl{from{transform:skewX(-14deg) scaleY(0)}to{transform:skewX(-14deg) scaleY(1)}}
  .bar{width:min(320px,70vw);height:3px;background:rgba(236,232,225,.14);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#FF4655;box-shadow:0 0 12px #FF4655;animation:go 1.6s ease-in-out infinite}
  @keyframes go{0%{width:0;margin-left:0}70%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
  p{margin:0;font-size:12px;letter-spacing:2px;color:#7f8e9b}
  a{color:#FF4655;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
<script>location.replace("valorant-login.html");</script>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="sl"></span>AGENT ACCESS</div>
    <div class="bar"><i></i></div>
    <p>正在载入终端…若未自动跳转，请点 <a href="valorant-login.html">此处进入</a></p>
  </div>
</body>
</html>
